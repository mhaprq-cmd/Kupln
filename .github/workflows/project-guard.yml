name: Kupln Project Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kupln-project-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Project Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run Project Guard
        run: python tools/project-guard/guard.py
